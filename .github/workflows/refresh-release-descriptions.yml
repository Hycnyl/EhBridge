name: Refresh release descriptions
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-release-descriptions.yml
permissions:
  contents: write
concurrency:
  group: ehbridge-release-description-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Hycnyl/EhBridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update existing release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_JSON: >-
            [{"id":422024243,"tag":"1.0.0","before_sha256":"0002a925b7a9fa246c7dde47b042d059f33166d88b70701f780a0c79064ec3ae","body":"## 简体中文\n\n- 初始版本，提供散图与 CBZ 双向批量转换、同格式复制。\n- 支持扫描预览、处理进度、取消和报告导出。\n- 支持简体中文与 English、Material 3 主题及 Android 8.0+ universal APK。\n- CBZ 识别存在缺陷，修复见 [1.1.0](https://github.com/Hycnyl/EhBridge/releases/tag/1.1.0)。\n\n## English\n\n- Initial release with loose-image ↔ CBZ batch conversion and same-layout copying.\n- Scan previews, progress, cancellation and report export.\n- Simplified Chinese and English, Material 3 themes and a universal APK for Android 8.0+.\n- CBZ detection has a known defect; see [1.1.0](https://github.com/Hycnyl/EhBridge/releases/tag/1.1.0) for the fix.\n\n格式参考 / Format references：[EhViewer](https://github.com/UjuiUjuMandan/EhViewer) · [EhViewer-NekoInverter](https://github.com/EhViewer-NekoInverter/EhViewer)\n"},{"id":422088655,"tag":"1.1.0","before_sha256":"ec33e46e1baa02783cfe448e827fc7c6de4ce9fab2e7d5aec6f03483d5c72edd","body":"## 简体中文\n\n- 修复合法 CBZ 被误判、无法处理的问题。\n- 新增全部／散图／CBZ／无效筛选和可拖动的快速滚动滑块。\n- ComicInfo XML 与封面改为可选，缺失的输出 XML 可恢复或生成。\n- 非阻断提示支持按类型独立控制。\n- 支持 Android 13+ 主题图标。\n- 应用 ID 调整为 `com.hycnyl.ehbridge`。\n\n## English\n\n- Fix detection and processing of valid CBZ galleries.\n- Add All / Loose / CBZ / Invalid filters and a draggable fast-scroll thumb.\n- Make ComicInfo XML and covers optional; recover or generate missing output XML.\n- Add independent controls for each nonblocking warning type.\n- Support themed app icons on Android 13+.\n- Change the application ID to `com.hycnyl.ehbridge`.\n\n画廊命名参考 / Gallery naming reference：[EhViewer](https://github.com/UjuiUjuMandan/EhViewer)\n"},{"id":422117160,"tag":"1.1.1","before_sha256":"cdb00fb356a5778c187a2270d9fff7b39886b066fd5da6dbb8823879b7fb17d8","body":"## 简体中文\n\n- 散图缺少 `.ehviewer` 时仅显示非阻断提示，仍可转换或复制。\n- 菜单末项改为「关于」，包含软件信息、作者、项目链接和使用指南。\n- 普通图标主体居中缩小至 90%，主题图标保持原样。\n\n## English\n\n- Allow conversion and copying of loose galleries without `.ehviewer`, with a nonblocking warning.\n- Replace the final menu item with About, including software information, author, project links and a usage guide.\n- Center and scale ordinary icon artwork to 90%, keeping the themed icon unchanged.\n\n图标规范参考 / Icon design reference：[Android adaptive icons](https://developer.android.com/develop/ui/compose/system/icon_design_adaptive)\n"}]
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          
          if os.environ.get("GITHUB_REPOSITORY") != "Hycnyl/EhBridge":
              raise RuntimeError("Unexpected repository")
          updates = json.loads(os.environ["UPDATES_JSON"])
          base = "https://api.github.com/repos/Hycnyl/EhBridge"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          
          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          
          def signature(release):
              fields = ("id", "tag_name", "target_commitish", "name", "draft", "prerelease", "published_at", "immutable")
              result = {key: release.get(key) for key in fields}
              keys = ("id", "name", "size", "digest", "content_type", "label")
              result["assets"] = sorted(
                  ({key: asset.get(key) for key in keys} for asset in release.get("assets", [])),
                  key=lambda asset: asset["id"],
              )
              return result
          
          ready = []
          for update in updates:
              release = api("GET", "/releases/" + str(update["id"]))
              if release["tag_name"] != update["tag"]:
                  raise RuntimeError("Release tag mismatch")
              current_body = release.get("body") or ""
              if current_body != update["body"] and hashlib.sha256(current_body.encode()).hexdigest() != update["before_sha256"]:
                  raise RuntimeError("Release description changed after preparation: " + update["tag"])
              ready.append((update, signature(release), current_body == update["body"]))
          
          for update, original_signature, already_updated in ready:
              path = "/releases/" + str(update["id"])
              if not already_updated:
                  api("PATCH", path, {"body": update["body"]})
              result = api("GET", path)
              if result.get("body") != update["body"] or signature(result) != original_signature:
                  raise RuntimeError("Release verification failed: " + update["tag"])
              print("Updated and verified release " + update["tag"])
          PY
